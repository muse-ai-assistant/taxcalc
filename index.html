<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个税计算 · 月度个人所得税计算器</title>
<meta name="description" content="按中国现行税法计算月度个人所得税，纯本地计算不上传。">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1220">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1220;--card:#131d33;--line:#243355;--ink:#e8eefb;--mut:#8b9bb8;--acc:#f5b942;--acc2:#38bdf8;--ok:#34d399}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,var(--bg) 60%);color:var(--ink);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;padding:26px 0 18px}
header h1{font-size:1.6rem;letter-spacing:.25em}
header h1 span{color:var(--acc)}
header p{color:var(--mut);font-size:.78rem;margin-top:8px;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:7px}
.fld label b{color:var(--ink);font-weight:600}
.inwrap{position:relative}
.inwrap .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:.85rem}
input[type=number],input[type=text]{width:100%;padding:13px 44px 13px 14px;border:1px solid var(--line);border-radius:10px;font-size:1.05rem;background:#0d1526;color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.hint{font-size:.72rem;color:var(--mut);margin-top:6px;line-height:1.7}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;letter-spacing:.15em;background:linear-gradient(135deg,#f5b942,#e8930c);color:#231600;cursor:pointer}
.btn:active{transform:scale(.99)}
.res{display:none}
.res.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.big3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.big3 .b{background:#0d1526;border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.big3 .b .k{font-size:.7rem;color:var(--mut);margin-bottom:6px}
.big3 .b .v{font-size:1.15rem;font-weight:700}
.big3 .b .v.tax{color:#f87171}.big3 .b .v.net{color:var(--ok)}.big3 .b .v.rate{color:var(--acc)}
.detail{font-size:.8rem;color:var(--mut);line-height:2;border-top:1px dashed var(--line);padding-top:12px}
.detail b{color:var(--ink);font-family:monospace}
.lvlt{font-size:.85rem;margin:14px 0 8px;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:.7rem}
.bar-row .lb{width:86px;color:var(--mut);flex:none;text-align:right}
.bar-row .tr{flex:1;height:16px;background:#0d1526;border-radius:8px;overflow:hidden;position:relative}
.bar-row .fl{height:100%;background:linear-gradient(90deg,#38bdf8,#0ea5e9);border-radius:8px}
.bar-row.hit .fl{background:linear-gradient(90deg,#f5b942,#e8930c)}
.bar-row .pc{width:44px;color:var(--mut);flex:none}
.bar-row.hit .lb{color:var(--acc);font-weight:700}
.note{font-size:.72rem;color:var(--mut);text-align:center;line-height:2;margin-top:10px}
footer{text-align:center;color:#3d4c6b;font-size:.7rem;letter-spacing:.3em;margin-top:26px}
@media(max-width:480px){.big3 .b .v{font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>个<span>税</span>计算</h1><p>中国现行税法 · 月度个人所得税</p></header>

<div class="card">
<div class="fld"><label><b>税前月薪</b></label><div class="inwrap"><input type="number" id="sal" placeholder="例如 20000" min="0"><span class="unit">元</span></div></div>
<div class="fld"><label><b>五险一金</b>（月，个人缴纳部分）</label><div class="inwrap"><input type="number" id="ins" placeholder="例如 3000" min="0"><span class="unit">元</span></div></div>
<div class="fld"><label><b>专项附加扣除</b>（月，可填 0）</label><div class="inwrap"><input type="number" id="ded" placeholder="子女教育/房贷/赡养等合计" min="0"><span class="unit">元</span></div>
<div class="hint">专项附加扣除：子女教育、继续教育、大病医疗、住房贷款利息、住房租金、赡养老人、3岁以下婴幼儿照护，月度合计填入。</div>
<div style="margin-top:18px"><button class="btn" id="go">计 算</button></div>
</div>

<div class="card res" id="res">
<div class="big3">
<div class="b"><div class="k">月应缴个税</div><div class="v tax" id="r-tax">—</div></div>
<div class="b"><div class="k">税后到手</div><div class="v net" id="r-net">—</div></div>
<div class="b"><div class="k">适用税率</div><div class="v rate" id="r-rate">—</div></div>
</div>
<div class="detail" id="r-detail"></div>
<div class="lvlt" id="r-lvl"></div>
<div class="bars" id="r-bars"></div>
</div>

<p class="note">应纳税所得额 = 税前月薪 − 5000（起征点）− 五险一金 − 专项附加扣除（负数按 0 计）<br>七级超额累进税率，按月换算。结果仅供参考，以税务机关核定为准。</p>
<footer>个税计算 v1.0</footer>
</div>

<script>
const $=id=>document.getElementById(id);
// [上限, 税率, 速算扣除数, 标签]
const BR=[[3000,.03,0,'不超过3000'],[12000,.10,210,'3000~12000'],[25000,.20,1410,'12000~25000'],[35000,.25,2660,'25000~35000'],[55000,.30,4410,'35000~55000'],[80000,.35,7160,'55000~80000'],[Infinity,.45,15160,'超过80000']];
const fmt=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){
  const sal=+$('sal').value||0, ins=+$('ins').value||0, ded=+$('ded').value||0;
  if(!sal){alert('请先填写税前月薪');return}
  let base=sal-5000-ins-ded; if(base<0)base=0;
  let idx=0; for(let i=0;i<BR.length;i++){if(base<=BR[i][0]){idx=i;break}}
  const[lim,rate,quick]=BR[idx];
  const tax=Math.max(0,base*rate-quick);
  const net=sal-ins-tax;
  $('r-tax').textContent=fmt(tax);
  $('r-net').textContent=fmt(net);
  $('r-rate').textContent=(rate*100)+'%';
  $('r-detail').innerHTML=`应纳税所得额 = ${fmt(sal)} − ¥5,000.00 − ${fmt(ins)} − ${fmt(ded)} = <b>${fmt(base)}</b><br>应缴个税 = ${fmt(base)} × ${(rate*100)}% − ${fmt(quick)} = <b>${fmt(tax)}</b><br>税后到手 = ${fmt(sal)} − ${fmt(ins)} − ${fmt(tax)} = <b>${fmt(net)}</b>`;
  $('r-lvl').innerHTML=`落在<b style="color:#f5b942">第 ${idx+1} 级</b>（${BR[idx][3]}，税率 ${(rate*100)}%）`;
  const max=Math.max(base,80000);
  $('r-bars').innerHTML=BR.map((b,i)=>{
    const lo=i===0?0:BR[i-1][0], w=Math.min(Math.max(base-lo,0),b[0]-lo)/(b[0]-lo)*100;
    return `<div class="bar-row${i===idx?' hit':''}"><span class="lb">${b[3]}</span><span class="tr"><span class="fl" style="width:${Math.min(w,100).toFixed(1)}%"></span></span><span class="pc">${(b[1]*100)}%</span></div>`;
  }).join('');
  $('res').classList.add('show');
  $('res').scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('go').onclick=calc;
['sal','ins','ded'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')calc()}));
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
